<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#EEF0FF"><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="hg/app.css"><meta name="description" content="합격온 — 국가직 9급 세법·회계·국어·영어 기출, 한국사, 영단어, 독해 분석과 오답노트를 한 곳에서. 모든 기록은 내 기기에만 저장돼요."><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="합격온"><title>합격온 · 9급 공무원 기출·오답노트·영단어·독해</title>
<style>
:root{--p:#8b6fd6;--p2:#b9a4f0;--pl:#f1ebff;--pk:#ffd6e5;--bg:#fff8f2;--ink:#3d3550;--ok:#5bbf8a;--no:#f07a8a}
*{box-sizing:border-box}body{margin:0;font-family:"Jua","Gaegu","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:radial-gradient(circle at 10% 0,#ffe9f2 0,transparent 40%),radial-gradient(circle at 100% 20%,#ece4ff 0,transparent 45%),var(--bg);color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;position:sticky;top:0;background:rgba(255,248,242,.9);backdrop-filter:blur(6px);z-index:5;border-bottom:2px dashed #e6dcff}
.logo{font-weight:800;font-size:20px;color:var(--p)}.logo small{color:#c48ab0;font-size:13px;margin-left:4px}
nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}nav button{border:0;background:#fff;border-radius:999px;padding:7px 12px;font:inherit;color:var(--ink);box-shadow:0 2px 0 #e6dcff;cursor:pointer}nav button.on{background:var(--p);color:#fff}
main{max-width:860px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 6px 0 #ece4ff,0 10px 30px rgba(139,111,214,.08);margin-bottom:16px}
.hero{display:flex;align-items:flex-end;gap:16px;overflow:hidden;background:linear-gradient(135deg,#f6f0ff,#fff0f6)}
.hero img{width:150px;flex:none;border-radius:20px;mix-blend-mode:multiply}
.hero h1{font-size:34px;margin:0 0 6px;color:var(--p);text-shadow:3px 3px 0 #fff,4px 4px 0 var(--pk);line-height:1.15}
.tag{display:inline-block;background:#fff;border:2px dashed var(--p2);border-radius:12px;padding:4px 10px;transform:rotate(-2deg);color:#a0679a;margin-bottom:12px}
.btn{border:0;border-radius:999px;padding:12px 20px;font:inherit;font-size:16px;cursor:pointer;background:linear-gradient(#a58bea,var(--p));color:#fff;box-shadow:0 4px 0 #6b52b5;margin:4px 6px 4px 0}
.btn.sub{background:#fff;color:var(--p);box-shadow:0 4px 0 #ddd0ff;border:2px solid var(--p2)}.btn:active{transform:translateY(3px);box-shadow:none}
.bubble{position:relative;background:#fff;border:2px solid var(--p2);border-radius:18px;padding:8px 14px;display:inline-block;font-size:15px}
.bubble:after{content:"";position:absolute;left:-10px;bottom:12px;border:8px solid transparent;border-right-color:var(--p2)}
.mascot{display:flex;align-items:center;gap:10px;margin:8px 0}.mascot img{width:70px;height:70px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid var(--pl);background:#f3f0f6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--pl);border-radius:18px;padding:12px;text-align:center}.stat b{display:block;font-size:24px;color:var(--p)}
.bar{height:12px;background:#eee6ff;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p))}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.pill{background:var(--pk);color:#9b4d72;border-radius:999px;padding:3px 10px;font-size:13px}
.stem{white-space:pre-wrap;font-size:17px;line-height:1.6;margin:12px 0;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.ch{display:block;width:100%;text-align:left;border:2px solid #eee6ff;background:#fff;border-radius:16px;padding:11px 14px;margin:8px 0;font:inherit;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;cursor:pointer;color:var(--ink)}
.ch:hover{border-color:var(--p2)}.ch.ok{background:#e8f8ef;border-color:var(--ok)}.ch.no{background:#ffecef;border-color:var(--no)}
.exp{white-space:pre-wrap;background:#fbf9ff;border-left:5px solid var(--p2);border-radius:12px;padding:12px 14px;line-height:1.65;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14.5px}
details{margin-top:10px}summary{cursor:pointer;color:var(--p)}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.grid span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f2eefb;font-size:13px;cursor:pointer}.grid .o{background:#cdeedd}.grid .x{background:#ffd3da}.grid .cur{outline:3px solid var(--p)}
.wn{border:2px dashed #f3c6d6}.done{opacity:.55}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:10px}.yc small span{display:block;white-space:nowrap}.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}.sc{border:2px solid #eee6ff;border-radius:20px;padding:12px;text-align:center;cursor:pointer;background:#fff}.sc.on{border-color:var(--p);background:linear-gradient(135deg,#f6f0ff,#fff0f6)}.sc b{font-size:19px;color:var(--p);display:block}.sc small{color:#8a7fa6}.sc small span{display:block;white-space:nowrap}.oxb{font-size:44px;width:120px;height:90px;border-radius:24px;border:3px solid #eee6ff;background:#fff;cursor:pointer;margin:6px;font-family:inherit}.oxb.o{color:#3b9bd9}.oxb.x{color:#e5677a}.oxb:disabled{cursor:default}.oxb.sel{border-color:var(--p)}.oxb.right{background:#e8f8ef;border-color:var(--ok)}.oxb.bad{background:#ffecef;border-color:var(--no)}.ctx{white-space:pre-wrap;background:#f7f4ff;border-radius:12px;padding:8px 12px;font-size:13.5px;color:#6c5f8d;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.oxtag{background:#d9f0ff;color:#2b77a8;border-radius:999px;padding:3px 10px;font-size:13px;margin-right:4px}.stag{background:#ffe9c7;color:#a8691d;border-radius:999px;padding:3px 10px;font-size:13px;margin-right:4px}
.yc{border:2px solid #eee6ff;border-radius:18px;padding:10px;text-align:center;cursor:pointer;background:#fff}.yc.on{border-color:var(--p);background:var(--pl)}.yc b{font-size:20px;color:var(--p);display:block}.yc small{color:#8a7fa6}
select{font:inherit;border-radius:12px;border:2px solid #e6dcff;padding:6px 10px;background:#fff;color:var(--ink)}
.ytag{background:var(--pl);color:var(--p);border-radius:999px;padding:3px 10px;font-size:13px;margin-right:4px}
@media(max-width:600px){.subs{grid-template-columns:1fr}.hero h1{font-size:26px}.hero img{width:100px}.stats{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}nav{margin-left:0}}
</style></head><body>
<header><div class="logo"><img src="hg/logo.svg" alt=""><span class="hg-word">합격온</span></div><nav id="nav"></nav></header>
<main id="app"></main>
<script src="data/2020.js"></script><script src="data/2021.js"></script><script src="data/2022.js"></script><script src="data/2023.js"></script><script src="data/2024.js"></script><script src="data/2025.js"></script><script src="data/2026.js"></script>
<script src="data/acc_2020.js"></script><script src="data/acc_2021.js"></script><script src="data/acc_2022.js"></script><script src="data/acc_2023.js"></script><script src="data/acc_2024.js"></script><script src="data/acc_2025.js"></script><script src="data/acc_2026.js"></script><script src="data/pri_2020.js"></script><script src="data/pri_2021.js"></script><script src="data/pri_2022.js"></script><script src="data/pri_2023.js"></script><script src="data/pri_2024.js"></script><script src="data/pri_2025.js"></script><script src="data/pri_2026.js"></script><script src="data/hist_75.js"></script><script src="data/hist_76.js"></script><script src="data/hist_77.js"></script><script src="data/hist_78.js"></script><script src="data/hist_79.js"></script><script src="data/ox.js"></script><script src="data/hist_ox.js"></script>
<script>
const SUBJ={tax:'세법개론',acc:'회계학',pri:'회계원리',hist:'한국사 심화'},SUBS=['tax','acc','pri','hist'];
const yl=(sub,y)=>sub=='hist'?'제'+y+'회':y+'년',ys=(sub,y)=>sub=='hist'?'제'+y+'회':y,bk=(sub,b)=>sub=='hist'?'심화':b+'책형';
const EXS=(window.EXAM_DATA||[]).slice();EXS.forEach(e=>{e.subject=({'세법개론':'tax','회계학':'acc','회계원리':'pri','한국사 심화':'hist'})[e.subject]||e.subject||'tax'});EXS.sort((a,b)=>SUBS.indexOf(a.subject)-SUBS.indexOf(b.subject)||a.year-b.year);
const ALL={};EXS.forEach(e=>e.questions.forEach(q=>{ALL[e.subject+'-'+e.year+'-'+q.no]=Object.assign({year:e.year,sub:e.subject,exam:e},q)}));
const KEY='gtapa_v3';
const OXL=(window.OX_DATA||[]),OXM={};OXL.forEach(o=>OXM[o.id]=o);
const oxOf=(sub,y)=>OXL.filter(o=>(sub=='all'||o.sub==sub)&&(y=='all'||o.year==y)).map(o=>o.id);
const yearsOf=sub=>EXS.filter(e=>e.subject==sub).map(e=>e.year);
let S=JSON.parse(localStorage.getItem(KEY)||'null');
if(!S){S={res:{},wrong:{},sub:'tax',yr:{}};
 // migrate v2 (세법개론 multi-year, key year-no)
 try{const v=JSON.parse(localStorage.getItem('gtapa_세법개론_v2')||'null');if(v){for(const k in v.res){const m=k.match(/^(orig|var)\|(\d{4}-\d+)$/);if(m)S.res[m[1]+'|tax-'+m[2]]=v.res[k]}for(const k in v.wrong){if(/^\d{4}-\d+$/.test(k))S.wrong['tax-'+k]=v.wrong[k]}if(v.year)S.yr.tax=v.year;S.migratedV2=1}}catch(e){}
 // migrate v1 (2026 세법 only, index-keyed)
 try{const o=JSON.parse(localStorage.getItem('gtapa_세법개론_2026')||'null');if(o&&!S.migratedV2){for(const k in o.res){const m=k.match(/^(orig|var)(\d+)$/);if(m)S.res[m[1]+'|tax-2026-'+(+m[2]+1)]=o.res[k]}for(const k in o.wrong){S.wrong['tax-2026-'+(+k+1)]=o.wrong[k]}}}catch(e){}
}
S.ox=S.ox||{};S.oxw=S.oxw||{};SUBS.forEach(s=>{if(!S.yr[s]||!yearsOf(s).includes(S.yr[s]))S.yr[s]=yearsOf(s).slice(-1)[0]});if(!SUBJ[S.sub])S.sub='tax';
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));save();
const M={hero:'hero.png',wave:'wave.png',think:'thinking.png',ok:['bright.png','laughing.png','wink.png'],no:['surprised.png','shy.png'],neutral:'neutral.png',cute:'cute.png',serious:'serious.png',gentle:'gentle.png'};
const pick=a=>Array.isArray(a)?a[Math.floor(Math.random()*a.length)]:a;
const N='①②③④⑤',esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mascot=(img,t)=>`<div class="mascot"><img src="${pick(img)}" alt="준혁"><span class="bubble">${t}</span></div>`;
const exOf=(sub,y)=>EXS.find(e=>e.subject==sub&&e.year==y);
const keysOf=(sub,y)=>exOf(sub,y).questions.map(q=>sub+'-'+y+'-'+q.no);
const keysSub=sub=>Object.keys(ALL).filter(k=>ALL[k].sub==sub);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sortK=(a,b)=>SUBS.indexOf(ALL[a].sub)-SUBS.indexOf(ALL[b].sub)||ALL[a].year-ALL[b].year||ALL[a].no-ALL[b].no;
let view='home',st=null,noteYear='all',noteSub='all',noteType='all';
function curEx(){return exOf(S.sub,S.yr[S.sub])}
function navR(){const on=k=>(view==k||(view=='quiz'&&st&&st.nav==k))?'on':'';document.getElementById('nav').innerHTML=`<button class="${on('home')}" onclick="go('home')">홈</button><button class="${on('orig')}" onclick="go('orig')">원본 기출</button><button class="${on('var')}" onclick="go('var')">변형문제</button><button class="${on('ox')}" onclick="go('ox')">⭕❌ OX</button><button class="${on('mix')}" onclick="go('mix')">🎲 전체 랜덤</button><button class="${on('note')}" onclick="go('note')">오답노트</button>`}
function go(k){const y=S.yr[S.sub];if(k=='ox')startOX(oxOf(S.sub,y),`${SUBJ[S.sub]} ${ys(S.sub,y)} OX 퀴즈`,'ox');else if(k=='orig'||k=='var')start(k,keysOf(S.sub,y),`${SUBJ[S.sub]} ${ys(S.sub,y)} ${k=='orig'?'원본 기출':'변형문제'}`,k);else{view=k;st=null;render()}}
function setYear(y){S.yr[S.sub]=y;save();render()}
function setSub(s){S.sub=s;save();render()}
function start(mode,list,title,nav,modes){if(!list.length){alert('풀 문제가 없어요!');return}view='quiz';st={mode,list,i:0,picked:null,title,nav:nav||mode,modes};render();scrollTo(0,0)}
function startOX(list,title,nav){if(!list.length){alert('풀 OX 문항이 없어요!');return}view='quiz';st={ox:1,list,i:0,picked:null,title,nav};render();scrollTo(0,0)}
function oxStats(ids){let t=0,c=0;ids.forEach(i=>{const r=S.ox[i];if(r!==undefined){t++;if(r)c++}});const w=ids.filter(i=>S.oxw[i]&&!S.oxw[i].done).length;return{t,c,w,tot:ids.length,rate:t?Math.round(c/t*100):0}}
const oxRow=x=>`<div class="stats"><div class="stat"><b>${x.t}/${x.tot}</b>푼 OX</div><div class="stat"><b>${x.rate}%</b>OX 정답률</div><div class="stat"><b>${x.w}</b>OX 복습할 오답</div><div class="stat"><b>${x.tot-x.t}</b>남은 OX</div></div><div class="bar" style="margin-top:10px"><i style="width:${x.tot?x.t/x.tot*100:0}%"></i></div>`;
function srcKey(o){return o.sub+'-'+o.year+'-'+o.no}
function oxQuiz(){const {list,i,picked}=st,id=list[i],o=OXM[id],q=ALL[srcKey(o)];let h=`<div class="card"><div class="qhead"><b>${st.title} · ${i+1}/${list.length}</b><span><span class="oxtag">OX</span><span class="stag">${SUBJ[o.sub]}</span><span class="ytag">${ys(o.sub,o.year)} ${bk(o.sub,o.booklet)}</span><span class="pill">${esc(o.topic)}</span></span></div><div class="bar" style="margin:8px 0"><i style="width:${(i+1)/list.length*100}%"></i></div>`;
if(picked==null)h+=mascot(M.think,'이 지문, O일까 X일까? 🤔');else h+=picked==o.ox?mascot(M.ok,pick(['OX 정답! 감 좋다 ✨','맞았어! 이 선지는 이제 내 거 😆','굿! 다음 지문 가자!'])):mascot(M.no,`앗, 정답은 ${o.ox}! 오답노트에 넣어둘게 📒`);
h+=`<div class="ctx">📌 ${o.cond=='fit'?'다음에 해당하면 O, 아니면 X':'옳은 설명이면 O, 틀린 설명이면 X'}\n${esc(o.ctx)}</div><div class="stem">[${SUBJ[o.sub]} ${ys(o.sub,o.year)} ${o.kind=='o'?'기출':'변형'} ${o.no}번 · ${typeof o.c=='number'?'선지 '+N[o.c-1]:o.c}] ${esc(o.s)}</div>`;
h+=`<div style="text-align:center">${['O','X'].map(v=>{let cl='oxb '+(v=='O'?'o':'x');if(picked!=null){if(v==o.ox)cl+=' right';else if(v==picked)cl+=' bad'}return`<button class="${cl}" ${picked!=null?'disabled':''} onclick="oxAnswer('${v}')">${v=='O'?'⭕':'❌'}</button>`}).join('')}</div>`;
if(picked!=null){h+=`<h3>💡 해설 · 정답 ${o.ox}</h3><div class="exp">${esc(o.exp)}</div>`;if(q){const d=o.kind=='o'?q:q.variant;h+=`<details><summary>🔗 원 문항 보기 (${yl(o.sub,o.year)} ${o.no}번 ${o.kind=='o'?'원본':'변형'})</summary>${imgT(q)}${block(d,o.kind=='o'?'원본':'변형')}</details>`}
h+=`<div style="margin-top:14px">${i>0?'<button class="btn sub" onclick="mv(-1)">← 이전</button>':''}${i<list.length-1?'<button class="btn" onclick="mv(1)">다음 문제 →</button>':'<button class="btn" onclick="go(\'home\')">🏁 완료! 홈으로</button>'}</div>`}
h+=`<div class="grid">${list.map((x,j)=>{const r=S.ox[x];return`<span class="${r===true?'o':r===false?'x':''} ${j==i?'cur':''}" title="${x}" onclick="jump(${j})">${j+1}</span>`}).join('')}</div></div>`;return h}
function oxAnswer(v){const id=st.list[st.i],o=OXM[id],ok=v==o.ox;st.picked=v;S.ox[id]=ok;if(!ok)S.oxw[id]={done:false,t:Date.now(),picked:v};save();render()}
function oxWrong(sb,y){return Object.keys(S.oxw).filter(i=>OXM[i]&&!S.oxw[i].done&&(sb=='all'||OXM[i].sub==sb)&&(y=='all'||OXM[i].year==y))}
function modeOf(k){return st.mode=='mixed'?st.modes[k]:st.mode}
function stats(keys){let t=0,c=0;keys.forEach(k=>['orig','var'].forEach(m=>{const r=S.res[m+'|'+k];if(r!==undefined){t++;if(r)c++}}));const w=keys.filter(k=>S.wrong[k]&&!S.wrong[k].done).length;const d=keys.filter(k=>S.wrong[k]&&S.wrong[k].done).length;return{t,c,w,d,tot:keys.length*2,rate:t?Math.round(c/t*100):0}}
const statRow=x=>`<div class="stats"><div class="stat"><b>${x.t}/${x.tot}</b>푼 문제</div><div class="stat"><b>${x.rate}%</b>정답률</div><div class="stat"><b>${x.w}</b>복습할 오답</div><div class="stat"><b>${x.d}</b>복습완료</div></div><div class="bar" style="margin-top:10px"><i style="width:${x.tot?x.t/x.tot*100:0}%"></i></div>`;
function home(){const ex=curEx(),sub=S.sub,s=stats(keysOf(sub,ex.year)),SS=stats(keysSub(sub)),A=stats(Object.keys(ALL));
return`<div class="card hero"><img src="${M.hero}" alt="준혁"><div><span class="tag">준혁이와 함께하는 과목별 기출 ♡</span><h1>합격온<br>과목별 기출</h1><div>국가직 9급 세법개론 · 회계학 · 회계원리 2020~2026 + 한국사능력검정 심화 제75~79회 · 총 ${Object.keys(ALL).length}문항</div><div style="margin-top:10px"><button class="btn" onclick="go('orig')">⚔ ${SUBJ[sub]} ${ys(sub,ex.year)} 기출 타파!</button><button class="btn sub" onclick="go('var')">🔁 ${ys(sub,ex.year)} 변형문제</button><button class="btn sub" onclick="go('ox')">⭕❌ ${ys(sub,ex.year)} OX</button><button class="btn sub" onclick="go('mix')">🎲 전체 랜덤</button></div></div></div>
<div class="card">${mascot(M.cute,'오늘은 어떤 과목을 타파할까? 과목부터 골라줘!')}<div class="subs">${SUBS.map(x=>{const k=keysSub(x),y=stats(k);return`<div class="sc ${x==sub?'on':''}" onclick="setSub('${x}')"><b>${SUBJ[x]}</b><small><span>${k.length}문항${x=='tax'||x=='hist'?' · 전 문항':' · 말문제만'}</span><span>${y.t}/${y.tot} 풀이 · 정답률 ${y.rate}%</span><span>복습할 오답 ${y.w}개</span><span>OX ${oxStats(oxOf(x,'all')).t}/${oxOf(x,'all').length} · ${oxStats(oxOf(x,'all')).rate}%</span></small></div>`}).join('')}</div></div>

function vBegin(mode,list,title){if(!list.length){alert('복습할 단어가 없어요!');return}const modes={};list.forEach(k=>modes[k]=mode=='mix'?(Math.random()<.5?'q':'r'):mode);vst={list,i:0,picked:null,flip:false,title,modes,opts:{}};view='voca_run';render();scrollTo(0,0)}

function vRand(){let a=+vrA.value,b=+vrB.value;if(a>b)[a,b]=[b,a];const m=vrM.value;vBegin(m,shuffle(VL.filter(v=>v.d>=a&&v.d<=b).map(VK)).slice(0,+vrN.value),`🎲 DAY ${a}~${b} 랜덤`)}
function vReview(){vBegin('mix',shuffle(vDue()),'⏰ 오늘의 복습')}
function vOpts(k){if(vst.opts[k])return vst.opts[k];const v=VM[k];const near=VL.filter(x=>x!==v&&Math.abs(x.d-v.d)<=2&&x.m!=v.m);let pool=shuffle(near.filter(x=>x.p==v.p));if(pool.length<3)pool=pool.concat(shuffle(near.filter(x=>x.p!=v.p)));const o=shuffle([v].concat(pool.slice(0,3)));return vst.opts[k]=o}
function vRun(){const {list,i}=vst,k=list[i],v=VM[k],m=vst.modes[k];let h=`<div class="card"><div class="qhead"><b>${vst.title} · ${i+1}/${list.length}</b><span><span class="stag">영단어</span><span class="ytag">${DLB(v.d)}</span><span class="pill">${PN[v.p]||''}</span>${v.u?'<span class="pill">⚠ 정답지 없음·미검증</span>':''}</span></div><div class="bar" style="margin:8px 0"><i style="width:${(i+1)/list.length*100}%"></i></div>`;
if(m=='flash'){h+=vst.picked==null?mascot(vst.flip?M.gentle:M.think,vst.flip?'알았어? 솔직하게 골라줘 😊':'뜻이 떠오르면 카드를 눌러 확인해봐!'):vst.picked=='k'?mascot(M.ok,pick(['역시! 이 단어는 이제 내 거 ✨','굿! 다음 카드 😆'])):mascot(M.no,'괜찮아! 내일 다시 보여줄게 📅');
h+=`<div class="fc" onclick="vst.flip=!vst.flip;render()" style="cursor:pointer;min-height:180px;display:grid;place-items:center;text-align:center;border-radius:24px;border:3px dashed var(--p2);background:${vst.flip?'#fff0f6':'#f6f0ff'};padding:20px;margin:10px 0"><div><div style="font-size:38px;color:var(--p);font-family:Georgia,serif">${esc(v.w)}</div>${vst.flip?`<div class="vm" style="font-size:20px;margin-top:12px;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif">${esc(v.m)}</div>`:'<div style="color:#a99bc8;margin-top:10px">👆 눌러서 뒤집기</div>'}</div></div>
<div style="text-align:center"><button class="btn" onclick="vFlash('k')">🙆 알아요</button><button class="btn sub" onclick="vFlash('u')">🤔 모르겠어요</button></div>`}
else{const o=vOpts(k),p=vst.picked;h+=p==null?mascot(M.think,m=='q'?'이 단어의 뜻은? 🤔':'이 뜻의 단어는? 🤔'):VM[p]===v?mascot(M.ok,pick(['정답! 완전 타파 ✨','굿굿! 😆','역시 준혁이 친구!'])):mascot(M.no,`앗, 정답은 ${esc(m=='q'?v.m:v.w)}! 오답노트에 넣고 내일 다시 보자 📒`);
h+=`<div class="stem" style="text-align:center;font-size:${m=='q'?'32px;font-family:Georgia,serif;color:var(--p)':'20px'}">${esc(m=='q'?v.w:v.m)}</div>`;
o.forEach((x,j)=>{const xk=VK(x);let cl='';if(p!=null){if(x===v)cl='ok';else if(xk==p)cl='no'}h+=`<button class="ch ${cl}" ${p!=null?'disabled':''} onclick="vAns('${xk.replace(/'/g,"\\'")}')">${N[j]} ${esc(m=='q'?x.m:x.w)}${p!=null&&m=='r'?` <small style="color:#999">— ${esc(x.m)}</small>`:p!=null&&m=='q'?` <small style="color:#999">— ${esc(x.w)}</small>`:''}</button>`})}
const done=m=='flash'?vst.picked!=null:vst.picked!=null;
h+=`<div style="margin-top:12px">${i>0?'<button class="btn sub" onclick="vMv(-1)">← 이전</button>':''}${done||m=='flash'?(i<list.length-1?'<button class="btn" onclick="vMv(1)">다음 →</button>':'<button class="btn" onclick="view=\'voca\';render()">🏁 완료!</button>'):''}</div>`;
h+=`<div class="grid">${list.map((x,j)=>{const r=S.vq[x],c=S.vc[x];const cls=(vst.modes[x]=='flash'?(c===true?'o':c===false?'x':''):(r?(r.ok?'o':'x'):''));return`<span class="${cls} ${j==i?'cur':''}" onclick="vst.i=${j};vst.picked=null;vst.flip=false;render()">${j+1}</span>`}).join('')}</div></div>`;return h}
function vFlash(a){const k=vst.list[vst.i];vst.picked=a;vst.flip=true;S.vc[k]=a=='k';if(a=='u')vMiss(k,'모르겠어요');else vHit(k);save();render()}
function vAns(xk){const k=vst.list[vst.i];vst.picked=xk;const ok=xk==k;S.vq[k]={ok,t:Date.now()};if(ok){vHit(k)}else vMiss(k,VM[xk]?(vst.modes[k]=='q'?VM[xk].m:VM[xk].w):'');save();render()}
function vMv(d){vst.i+=d;vst.picked=null;vst.flip=false;render();scrollTo(0,0)}
let vnDay='all';
const _navR=navR;navR=function(){_navR();const n=document.getElementById('nav'),b=document.createElement('button');b.textContent='📚 영단어';if(view=='voca'||view=='voca_run')b.className='on';b.onclick=()=>{view='voca';render()};n.insertBefore(b,n.lastChild)};
const _note=note;note=function(){let h=_note();h=h.replace('</select>',`<option value="voca" ${noteSub=='voca'?'selected':''}>영단어</option></select>`);
if(noteType=='ox'||(noteSub!='all'&&noteSub!='voca'))return h;
const ws=Object.keys(S.vw).filter(k=>VM[k]&&(vnDay=='all'||VM[k].d==vnDay)).sort((a,b)=>VM[a].d-VM[b].d||VM[a].n-VM[b].n),open=ws.filter(k=>!S.vw[k].done);
let x=`<div class="card"><div class="qhead"><b>📚 영단어 오답 <span class="pill">복습할 단어 ${open.length}개 · 오늘의 복습 ${vDue().length}</span></b><span>DAY <select id="vnD" onchange="vnDay=this.value=='all'?'all':+this.value;render()"><option value="all">전체</option>${VDAYS.map(d=>`<option value="${d}" ${vnDay==d?'selected':''}>${d}</option>`).join('')}</select></span></div>${open.length?`<button class="btn" onclick="vBegin('mix',shuffle(${JSON.stringify(open).replace(/"/g,"'")}),'📒 단어 오답 다시 풀기')">📒 단어 오답 다시 풀기</button>`:''}<button class="btn sub" onclick="vReview()">⏰ 오늘의 복습</button></div>`;
ws.forEach(k=>{const v=VM[k],w=S.vw[k],r=S.vsrs[k];const kj=k.replace(/'/g,"\\'");x+=`<div class="card wn vwn ${w.done?'done':''}"><div class="qhead"><b><span class="stag">영단어</span><span class="ytag">${DLB(v.d)}</span> <span style="font-family:Georgia,serif;font-size:20px">${esc(v.w)}</span></b><span class="pill">틀린 횟수 ${w.n}${r?' · 다음 복습 '+new Date(r.due).toLocaleDateString('ko-KR'):''}</span></div><div class="stem" style="font-size:16px">${esc(v.m)}${v.u?' <small>(⚠ 미검증)</small>':''}${w.picked?`<br><small style="color:#c77">내 답: ${esc(w.picked)}</small>`:''}</div><button class="btn ${w.done?'sub':''}" onclick="S.vw['${kj}'].done=!S.vw['${kj}'].done;save();render()">${w.done?'↺ 다시 복습 목록으로':'✔ 복습완료'}</button><button class="btn sub" onclick="delete S.vw['${kj}'];delete S.vsrs['${kj}'];save();render()">삭제</button></div>`});
return h+x};
const _render=render;render=function(){['vc','vw','vq','vsrs'].forEach(f=>S[f]=S[f]||{});S.vday=S.vday||1;if(view=='voca'||view=='voca_run'){navR();document.getElementById('app').innerHTML=view=='voca'?vocaHome():vRun()}else _render()};
render();
</script>
<script>
/* ===== 영단어 듣기 (Web Speech API) ===== */
const TK='gtapa_tts';let TTS=Object.assign({rate:1,auto:false,ko:false},JSON.parse(localStorage.getItem(TK)||'{}'));
const tSave=()=>localStorage.setItem(TK,JSON.stringify(TTS));
const hasSS=()=>'speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
let tUnlocked=false,tVoicesReady=false;
function tVoice(lang){if(!hasSS())return null;const vs=speechSynthesis.getVoices()||[];const L=lang.toLowerCase(),b=L.split('-')[0];
return vs.find(v=>(v.lang||'').toLowerCase().replace('_','-')==L)||vs.find(v=>(v.lang||'').toLowerCase().startsWith(b))||null}
function tNoEn(){return !hasSS()||(tVoicesReady&&!tVoice('en-US'))}
function say(text,lang){lang=lang||'en-US';if(!hasSS()){tNotice();return false}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=tVoice(lang);if(v)u.voice=v;else if(lang.startsWith('en')&&tVoicesReady){tNotice()}u.lang=lang;u.rate=lang.startsWith('en')?TTS.rate:1;speechSynthesis.speak(u);return true}catch(e){return false}}
function tNotice(){const n=document.getElementById('ttsn');if(n)n.style.display='block'}
function tUnlock(){if(tUnlocked||!hasSS())return;tUnlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener('touchend',tUnlock,{once:true,capture:true});document.addEventListener('click',tUnlock,{once:true,capture:true});
if(hasSS()){const f=()=>{if((speechSynthesis.getVoices()||[]).length){tVoicesReady=true;if(view=='voca'||view=='voca_run')render()}};f();speechSynthesis.onvoiceschanged=f;setTimeout(()=>{tVoicesReady=true},2500)}
function tBar(){return`<div class="ttsbar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;margin:6px 0">🔊 듣기 <label><input type="checkbox" id="ttsAuto" ${TTS.auto?'checked':''} onchange="TTS.auto=this.checked;tSave()"> 자동 재생</label> 속도 <select id="ttsRate" onchange="TTS.rate=+this.value;tSave()"><option value="0.7" ${TTS.rate==0.7?'selected':''}>느리게 0.7</option><option value="1" ${TTS.rate==1?'selected':''}>보통 1.0</option></select><label><input type="checkbox" id="ttsKo" ${TTS.ko?'checked':''} onchange="TTS.ko=this.checked;tSave()"> 뒤집으면 뜻 읽기</label></div><div id="ttsn" class="ctx" style="display:${tNoEn()?'block':'none'}">😢 이 기기/브라우저에서 영어 음성을 찾지 못했어요. 설정 &gt; 접근성(또는 언어)에서 영어 음성을 설치하거나 다른 브라우저(Chrome·Safari)로 열어줘! 듣기 없이도 나머지 기능은 그대로 쓸 수 있어.</div>`}
const spk=w=>`<button class="btn sub spk" style="padding:6px 12px" onclick="event.stopPropagation();say(${JSON.stringify(w).replace(/"/g,'&quot;')})">🔊</button>`;
/* patch voca UI */
const _vH=vocaHome;vocaHome=function(){let h=_vH();h=h.replace(`<button class="btn sub" onclick="vReview()">`,`<button class="btn sub" onclick="vGo('l')">🎧 듣기 퀴즈</button><button class="btn sub" onclick="vReview()">`);
h=h.replace('<option value="flash">플래시카드</option>','<option value="flash">플래시카드</option><option value="l">🎧 듣기 퀴즈</option>');
return h.replace('<div class="card">',`<div class="card">${tBar()}</div><div class="card">`)};
const _vGo=vGo;vGo=function(m){if(m=='l'){const d=S.vday;tUnlock();return vBegin('l',shuffle(vKeysDay(d)),`${DLB(d)} 🎧 듣기 퀴즈`)}if(m!='q'&&m!='r'&&m!='flash')return;_vGo(m)};
let tLast='';
const _vRun=vRun;vRun=function(){const k=vst.list[vst.i],v=VM[k],m=vst.modes[k];let h;
if(m=='l'){vst.modes[k]='q';h=_vRun();vst.modes[k]='l';const p=vst.picked;
 h=h.replace(/<div class="stem" style="text-align:center;font-size:32px[^"]*">[\s\S]*?<\/div>/,`<div class="stem" style="text-align:center"><button class="btn" style="font-size:22px" onclick="say(VM[vst.list[vst.i]].w)">🔊 다시 듣기</button>${p!=null?`<div style="font-size:30px;font-family:Georgia,serif;color:var(--p);margin-top:8px">${esc(v.w)}</div>`:'<div style="color:#a99bc8;margin-top:6px">단어를 듣고 뜻을 골라봐! 🎧</div>'}</div>`);
 h=h.replace(p==null?'이 단어의 뜻은? 🤔':'@@','잘 듣고 뜻을 골라줘 🎧');}
else{h=_vRun();if(m=='flash')h=h.replace(/(<div style="font-size:38px;color:var\(--p\);font-family:Georgia,serif">[\s\S]*?<\/div>)/,`$1<div>${spk(v.w)}</div>`);
 else if(m=='q')h=h.replace(/(<div class="stem" style="text-align:center;font-size:32px[^"]*">[\s\S]*?)(<\/div>)/,`$1 ${spk(v.w)}$2`)}
h=h.replace('<div class="bar" style="margin:8px 0">',tBar()+'<div class="bar" style="margin:8px 0">');
const key=vst.title+'|'+vst.i;if(tLast!=key){tLast=key;if(m=='l'||(TTS.auto&&(m=='flash'||m=='q')))setTimeout(()=>say(v.w),60)}
return h};
const _vAns=vAns;vAns=function(xk){const k=vst.list[vst.i];if(vst.modes[k]=='l'){vst.modes[k]='q';_vAns(xk);vst.modes[k]='l';render();return}_vAns(xk)};
const _vFl=vFlash;vFlash=function(a){const was=vst.flip;_vFl(a);if(!was&&TTS.ko)say(VM[vst.list[vst.i]].m,'ko-KR')};
document.addEventListener('click',e=>{const fc=e.target.closest&&e.target.closest('.fc');if(fc&&vst&&vst.flip&&TTS.ko)say(VM[vst.list[vst.i]].m,'ko-KR')});
render();
</script>
<script>
/* ===== PWA: 서비스워커 + 앱 설치 ===== */
(function(){const web=/^https?:$/.test(location.protocol);let bip=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.PWA={get prompt(){return bip},isIOS,standalone,web};
if(web&&'serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>{window.PWA.reg=r}).catch(e=>console.warn('SW',e)));
 let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded||!window.PWA.hadCtl)return;reloaded=true;location.reload()});window.PWA.hadCtl=!!navigator.serviceWorker.controller}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();bip=e;btn()});
addEventListener('appinstalled',()=>{bip=null;btn();alert('설치 완료! 홈 화면에서 준혁이를 만나봐 📲')});
function show(){return !standalone&&web&&(bip||isIOS)}
window.pwaInstall=async function(){if(bip){bip.prompt();const r=await bip.userChoice;bip=null;btn();return r.outcome}
 if(isIOS){const d=document.getElementById('iosHint');if(d)d.style.display=d.style.display=='none'?'block':'none'}};
function btn(){let b=document.getElementById('pwaBtn');const n=document.getElementById('nav');if(!n)return;if(!b){b=document.createElement('button');b.id='pwaBtn';b.textContent='📲 앱 설치';b.onclick=pwaInstall;}
 if(!b.isConnected)n.appendChild(b);b.style.display=show()?'':'none';
 let h=document.getElementById('iosHint');if(!h){h=document.createElement('div');h.id='iosHint';h.className='card';h.style.cssText='display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:20;max-width:520px;margin:0 auto';h.innerHTML='📲 <b>아이폰·아이패드에 설치하기</b><br>Safari 아래쪽 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 눌러줘! 그러면 앱처럼 오프라인에서도 쓸 수 있어 😊<div style="text-align:right"><button class="btn sub" onclick="this.closest(\'#iosHint\').style.display=\'none\'">닫기</button></div>';document.body.appendChild(h)}}
const _r=window.render;window.render=function(){_r.apply(this,arguments);btn()};btn();
})();
</script>

name: decode-binary-assets
on:
  push:
    branches: [main]
    paths: ['_b64/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: decode-assets
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode _b64/*.b64 into binary files
        run: |
          set -e
          [ -d _b64 ] || exit 0
          cd _b64
          find . -name '*.b64' | while read f; do
            out="../${f#./}"; out="${out%.b64}"
            mkdir -p "$(dirname "$out")"; base64 -d "$f" > "$out"; echo "decoded $out"
          done
          cd .. && git rm -r -q _b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "합격온 아이콘(PNG) 반영" && git push
